<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) — injected after load+idle, not <script async>:
         its 166KB was the third-largest resource in the LCP window on slow
         mobile (Plan.md chase-100 session #2). gtag() calls made before the
         script arrives queue in dataLayer and are replayed, so nothing is
         lost by loading it late. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-KKEFFHRLMJ');

      addEventListener('load', function () {
        var inject = function () {
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-KKEFFHRLMJ';
          document.head.appendChild(s);
        };
        'requestIdleCallback' in window
          ? requestIdleCallback(inject, { timeout: 3000 })
          : setTimeout(inject, 2000);
      });
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="An illustrated English–Chinese glossary of Homer's Odyssey (Emily Wilson translation), paired with public-domain masterworks." />
    <meta name="theme-color" content="#282a36" />
    <title>The Odyssey · An Illustrated Glossary</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/cinzel/v26/8vIJ7ww63mVu7gt79mT7PkRXMw.woff2" />
    <link rel="preload" as="image" href="/hero.jpg" fetchpriority="high" />
    <!-- Latin fonts only (masthead + body text, needed for first paint) —
         kept in the eager preload+swap path. Noto Sans SC is NOT requested
         from Google Fonts at all any more: their CJK pipeline sliced it into
         38 unicode-range chunks totalling ~2MB per cold load (59% of the
         whole page — the dominant mobile-Lighthouse bottleneck, see Plan.md
         chase-100 session #2), because every entry's Chinese text is in the
         prerendered DOM. It's now a 202KB self-hosted subset of the site's
         actual corpus, declared via @font-face in src/index.css and baked by
         scripts/subset_font.py. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
