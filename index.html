    <!-- Latin fonts only (masthead + body text, needed for first paint) —
         kept in the eager preload+swap path. Noto Sans SC is requested
         separately below, deferred: it's CJK-subsetted by Google Fonts into
         dozens of unicode-range chunks (~2MB total across every entry's
         Chinese name/definition, all in the DOM at once on the home page),
         and none of it is needed for first paint. Measured to NOT be the
         mobile LCP bottleneck on its own (see Plan.md's "chase 100"
         investigation — it's request concurrency from the lazy-loaded card
         thumbnails, not this) but there's no reason for ~2MB of CJK font to
         compete for bandwidth this early regardless. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap"
      media="print"
      onload="this.media='all'"
    />

        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Noto+Sans+SC:wght@400;500;700&display=swap"
