<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) — injected after load+idle, not <script async>:
         its 166KB was the third-largest resource in the LCP window on slow
         mobile (Plan.md chase-100 session #2). gtag() calls made before the
         script arrives queue in dataLayer and are replayed, so nothing is
         lost by loading it late. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-KKEFFHRLMJ');

      addEventListener('load', function () {
        var inject = function () {
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-KKEFFHRLMJ';
          document.head.appendChild(s);
        };
        'requestIdleCallback' in window
          ? requestIdleCallback(inject, { timeout: 3000 })
          : setTimeout(inject, 2000);
      });
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="An illustrated English–Chinese glossary of Homer's Odyssey (Emily Wilson translation), paired with public-domain masterworks." />
    <meta name="author" content="Ben Hinton" />
    <meta name="theme-color" content="#282a36" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "The Odyssey · An Illustrated Glossary",
        "url": "https://odysseygloss.vercel.app",
        "description": "An illustrated English–Chinese glossary of Homer's Odyssey (Emily Wilson translation), paired with public-domain masterworks.",
        "author": {
          "@type": "Person",
          "name": "Ben Hinton",
          "email": "mailto:bahinton@gmail.com"
        }
      }
    </script>
    <title>The Odyssey · An Illustrated Glossary</title>
    <!-- All fonts are self-hosted subsets now — no fonts.googleapis /
         fonts.gstatic at all (that chain's DNS + TLS + stylesheet round-trip
         gated first-paint readiness; Plan.md chase-100 session #2). Latin:
         scripts/subset_latin_fonts.py → public/fonts/ (versioned names,
         immutable cache — bump -v1 here and in index.css together). CJK:
         scripts/subset_font.py → Vite-hashed asset. @font-face lives in
         src/index.css. The two first-paint-critical files are preloaded
         here; the italic and CJK files load on CSS discovery. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/cinzel-var-v1.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/hanken-var-v1.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/hanken-italic-var-v1.woff2" />
    <!-- hero-blur.avif is ~2KB (pre-blurred + pre-darkened, see App.tsx);
         journey-map.webp is the first carousel slide and, because the baked
         hero is too low-entropy for LCP candidacy, the actual LCP element. -->
    <link rel="preload" as="image" href="/hero-blur.avif" fetchpriority="high" />
    <link rel="preload" as="image" href="/journey-map.webp" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
